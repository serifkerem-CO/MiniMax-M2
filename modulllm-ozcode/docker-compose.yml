version: '3.8'

services:
  # MODULllm.com Platform API
  modulllm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modulllm-platform
    ports:
      - "8000:8000"
    environment:
      - PLATFORM_NAME=MODULllm.com
      - OZ_KOD_MODE=true
      - GEMI_ENDPOINT=http://gemi.modulllm.com:8000
      # LLM endpoints (self-hosted)
      - MINIMAX_ENDPOINT=http://gemi.modulllm.com:8000/v1
      - LOCAL_LLM_1=http://ollama:11434/api
      - LOCAL_LLM_2=http://vllm:5000/v1
    volumes:
      - ./:/app
      - modulllm_data:/app/data
    depends_on:
      - redis
      # - ollama  # Self-hosted LLM (opsiyonel)
    networks:
      - modulllm-network
    restart: unless-stopped

  # Redis (caching)
  redis:
    image: redis:7-alpine
    container_name: modulllm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - modulllm-network
    restart: unless-stopped

  # Ollama (Self-hosted LLM - opsiyonel)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: modulllm-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   networks:
  #     - modulllm-network
  #   restart: unless-stopped

  # B1Z KODLAB Frontend (opsiyonel - ayrı deploy de olabilir)
  # b1z-frontend:
  #   build:
  #     context: ../b1z-kodlab/frontend
  #   container_name: b1z-kodlab-frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - modulllm-api
  #   networks:
  #     - modulllm-network

networks:
  modulllm-network:
    driver: bridge

volumes:
  modulllm_data:
  redis_data:
  # ollama_data:
