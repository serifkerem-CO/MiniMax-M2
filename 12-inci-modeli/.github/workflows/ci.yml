name: 12. İnci Modeli CI/CD

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ============================================
  # Backend Tests
  # ============================================
  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      working-directory: ./12-inci-modeli/api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run pytest
      working-directory: ./12-inci-modeli/api
      env:
        MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      run: |
        pytest test_app.py -v --cov=. --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./12-inci-modeli/api/coverage.xml
        flags: backend
        name: backend-coverage

  # ============================================
  # Code Quality Checks
  # ============================================
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install linting tools
      run: |
        pip install flake8 black isort mypy

    - name: Run black (formatter check)
      working-directory: ./12-inci-modeli/api
      run: |
        black --check .

    - name: Run flake8 (linter)
      working-directory: ./12-inci-modeli/api
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run isort (import sorting)
      working-directory: ./12-inci-modeli/api
      run: |
        isort --check-only .

  # ============================================
  # Security Scan
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Bandit (security linter)
      working-directory: ./12-inci-modeli/api
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v3
      with:
        name: bandit-security-report
        path: ./12-inci-modeli/api/bandit-report.json

  # ============================================
  # Docker Build
  # ============================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, code-quality]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API Docker image
      working-directory: ./12-inci-modeli
      run: |
        docker build -t 12-inci-api:${{ github.sha }} ./api

    - name: Test Docker image
      run: |
        docker run --rm 12-inci-api:${{ github.sha }} python --version

  # ============================================
  # Deploy to Staging (on main branch)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy notification
      run: |
        echo "🚀 Deploying to staging environment..."
        # Add actual deployment steps here (Heroku, Railway, etc.)

  # ============================================
  # Performance Tests
  # ============================================
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [test-backend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      working-directory: ./12-inci-modeli/api
      run: |
        pip install -r requirements.txt
        pip install locust

    - name: Run performance tests
      working-directory: ./12-inci-modeli/api
      run: |
        echo "Performance tests would run here with locust"
        # locust -f performance_test.py --headless -u 10 -r 2 -t 30s

  # ============================================
  # Notifications
  # ============================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [test-backend, code-quality, security, docker-build]
    if: always()

    steps:
    - name: Build status notification
      run: |
        if [ "${{ needs.test-backend.result }}" == "success" ] && \
           [ "${{ needs.code-quality.result }}" == "success" ] && \
           [ "${{ needs.docker-build.result }}" == "success" ]; then
          echo "✅ All checks passed!"
        else
          echo "❌ Some checks failed"
          exit 1
        fi
