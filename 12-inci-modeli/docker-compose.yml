version: '3.8'

services:
  # 12. İnci Modeli API Server
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: 12-inci-api
    ports:
      - "8000:8000"
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_GROUP_ID=${MINIMAX_GROUP_ID}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/inci12
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      - ./config:/app/config:ro
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - inci-network

  # Frontend Server (nginx)
  frontend:
    image: nginx:alpine
    container_name: 12-inci-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - inci-network

  # Redis (for caching)
  redis:
    image: redis:7-alpine
    container_name: 12-inci-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - inci-network

  # PostgreSQL (optional, for analytics)
  db:
    image: postgres:15-alpine
    container_name: 12-inci-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=inci12
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - inci-network

networks:
  inci-network:
    driver: bridge

volumes:
  redis-data:
  db-data:
