# Kubernetes Secrets for 12. İnci Modeli
# IMPORTANT: DO NOT commit real secrets to git!
# Use kubectl create secret or external secret managers

apiVersion: v1
kind: Secret
metadata:
  name: inci12-secrets
type: Opaque
stringData:
  # Replace with actual values
  minimax-api-key: "your_minimax_api_key_here"
  minimax-group-id: "your_group_id_here"
  database-url: "postgresql://user:password@postgres:5432/inci12"
  secret-key: "your_secret_key_for_jwt_here"

---
# How to create secrets from command line:
# kubectl create secret generic inci12-secrets \
#   --from-literal=minimax-api-key=YOUR_KEY \
#   --from-literal=minimax-group-id=YOUR_GROUP_ID \
#   --from-literal=database-url=postgresql://... \
#   --from-literal=secret-key=YOUR_SECRET_KEY
