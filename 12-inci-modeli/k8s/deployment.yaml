apiVersion: apps/v1
kind: Deployment
metadata:
  name: inci12-api
  labels:
    app: inci12
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: inci12
      component: api
  template:
    metadata:
      labels:
        app: inci12
        component: api
    spec:
      containers:
      - name: api
        image: inci12-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MINIMAX_API_KEY
          valueFrom:
            secretKeyRef:
              name: inci12-secrets
              key: minimax-api-key
        - name: MINIMAX_GROUP_ID
          valueFrom:
            secretKeyRef:
              name: inci12-secrets
              key: minimax-group-id
        - name: REDIS_URL
          value: "redis://inci12-redis:6379/0"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: inci12-secrets
              key: database-url
        - name: LOG_LEVEL
          value: "INFO"
        - name: DEBUG
          value: "False"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: inci12-api
  labels:
    app: inci12
    component: api
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: inci12
    component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inci12-frontend
  labels:
    app: inci12
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inci12
      component: frontend
  template:
    metadata:
      labels:
        app: inci12
        component: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: frontend-files
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: frontend-files
        configMap:
          name: inci12-frontend
      - name: nginx-config
        configMap:
          name: inci12-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: inci12-frontend
  labels:
    app: inci12
    component: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: inci12
    component: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inci12-redis
  labels:
    app: inci12
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inci12
      component: redis
  template:
    metadata:
      labels:
        app: inci12
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: inci12-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: inci12-redis
  labels:
    app: inci12
    component: redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: inci12
    component: redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inci12-redis-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
